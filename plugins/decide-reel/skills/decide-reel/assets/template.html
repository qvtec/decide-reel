<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>decide-reel</title>
<style>
:root {
  --ink: #111318;
  --sub: #5b6170;
  --mute: #9aa0ac;
  --line: #e6e8ed;
  --soft: #f4f5f8;
  --accent: #2b59ff;
  --accent-soft: #e8eeff;
  --hl: #ffd84d;
  --ok: #10b06f;
  --ok-soft: #e3f7ee;
  --unk: #ff5a5f;
  --unk-soft: #ffeced;
  --later: #e8930c;
  --later-soft: #fdf2df;
  --other: #8b5cf6;
  --other-soft: #f1ebfe;
  --outer: #e9ebef;
  --bar: #ffffff;
  --bar-ink: #16181d;
  --bar-line: #dfe2e7;
  --paper: #ffffff;
  --stage: var(--paper);
  --on: #ffffff;
  --accent-2: #a9bbff;
  --accent-fill: var(--accent);
  --hl-ink: var(--ink);
  --ok-ink: #08754a;
  --later-ink: #a8670a;
  --unk-ink: #c4383d;
  --dots: rgba(17, 19, 24, .09);
  --bw: 3px;
  --bw2: 2px;
  --edge: var(--ink);
  --r: 14px;
  --sh: 5px 5px 0 var(--ink);
  --sh-sm: 4px 4px 0 var(--ink);
  --sh-hi: 8px 8px 0 var(--ink);
  --sh-lo: 2px 2px 0 var(--ink);
  --ease: cubic-bezier(.16, 1, .3, 1);
  --pop: cubic-bezier(.2, 1.5, .4, 1);
  --font: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic UI", "Meiryo", system-ui, sans-serif;
}
/* テーマ：配色と、枠・影・角の丸めの組み合わせ。JSONの theme で選ぶ（T キーで試せる） */
:root[data-theme="navy"] {
  --ink: #1b2433; --sub: #5a6374; --mute: #9aa3b2; --line: #e3e7ee; --soft: #f3f5f9;
  --accent: #27477a; --accent-soft: #e7edf6; --accent-2: #a9b9d3; --hl: #e3b448;
  --ok: #3c8a69; --ok-soft: #e4f2ec; --unk: #c4544e; --unk-soft: #fbeceb; --unk-ink: #a8413c;
  --later: #c48a22; --later-soft: #fbf1df; --other: #6a5aa8; --other-soft: #eeebf7;
  --bw: 1.5px; --bw2: 1.5px; --edge: #cfd6e2; --r: 12px;
  --sh: 0 6px 18px rgba(27, 36, 51, .10); --sh-sm: 0 4px 12px rgba(27, 36, 51, .10);
  --sh-hi: 0 10px 26px rgba(27, 36, 51, .16); --sh-lo: 0 2px 6px rgba(27, 36, 51, .10);
  --dots: rgba(27, 36, 51, .07);
}
:root[data-theme="mono"] {
  --ink: #141414; --sub: #5e5e5e; --mute: #a3a3a3; --line: #e6e6e6; --soft: #f4f4f4;
  --accent: #e0482a; --accent-soft: #fbe9e4; --accent-2: #f1b4a6; --hl: #ffd9cc;
  --ok: #141414; --ok-soft: #ededed; --unk: #e0482a; --unk-soft: #fbe9e4; --unk-ink: #c23a1f;
  --later: #8a8a8a; --later-soft: #efefef; --other: #555555; --other-soft: #ececec;
  --bw: 2px; --bw2: 2px; --r: 6px;
  --sh: 4px 4px 0 var(--ink); --sh-sm: 3px 3px 0 var(--ink); --sh-hi: 6px 6px 0 var(--ink); --sh-lo: 1px 1px 0 var(--ink);
  --dots: rgba(20, 20, 20, .08);
}
:root[data-theme="natural"] {
  --paper: #fffdf8; --stage: #faf6ee;
  --ink: #3b352e; --sub: #7a7166; --mute: #b0a799; --line: #ebe4d8; --soft: #f3eee5;
  --accent: #5b8a6b; --accent-soft: #e6efe7; --accent-2: #b9cfbf; --hl: #efcb72;
  --ok: #5b8a6b; --ok-soft: #e6efe7; --unk: #cf6a4f; --unk-soft: #f8e7e1; --unk-ink: #b4553c;
  --later: #cf9a3f; --later-soft: #f8eedb; --other: #8a72b0; --other-soft: #efeaf5;
  --bw: 0px; --bw2: 1px; --edge: #e2d9ca; --r: 20px;
  --sh: 0 6px 20px rgba(59, 53, 46, .10); --sh-sm: 0 4px 12px rgba(59, 53, 46, .10);
  --sh-hi: 0 10px 28px rgba(59, 53, 46, .16); --sh-lo: 0 2px 6px rgba(59, 53, 46, .10);
  --dots: rgba(59, 53, 46, .07);
}
:root[data-theme="slate"] {
  --ink: #1f2a30; --sub: #5f6d75; --mute: #9eaab1; --line: #e2e8eb; --soft: #f2f5f6;
  --accent: #23807f; --accent-soft: #e2f1f0; --accent-2: #a7d0ce; --hl: #f5c75b;
  --ok: #23807f; --ok-soft: #e2f1f0; --unk: #d0645a; --unk-soft: #f9e8e6; --unk-ink: #b14d44;
  --later: #c9902e; --later-soft: #f8eedc; --other: #6f6aa8; --other-soft: #edecf6;
  --bw: 2px; --bw2: 1px; --edge: #cfd8dc; --r: 10px;
  --sh: 0 0 0 transparent; --sh-sm: 0 0 0 transparent; --sh-hi: 0 6px 16px rgba(31, 42, 48, .12); --sh-lo: 0 0 0 transparent;
  --dots: rgba(31, 42, 48, .06);
}
:root[data-theme="midnight"] {
  --paper: #141821; --stage: #0b0e14; --on: #ffffff;
  --ink: #eef1f7; --sub: #9aa3b5; --mute: #5f687a; --line: #242a37; --soft: #1a1f2a;
  --accent: #6d7cff; --accent-soft: #1d2142; --accent-2: #353c78; --accent-fill: linear-gradient(120deg, #7b6dff, #36c9e0);
  --hl: #36c9e0; --hl-ink: #06141a;
  --ok: #3ddc97; --ok-soft: #13291f; --ok-ink: #3ddc97; --unk: #ff6b81; --unk-soft: #2c1820; --unk-ink: #ff8a9b;
  --later: #ffb547; --later-soft: #2c2314; --later-ink: #ffb547; --other: #b18cff; --other-soft: #241d38;
  --bw: 1px; --bw2: 1px; --edge: rgba(255, 255, 255, .10); --r: 16px;
  --sh: 0 12px 32px rgba(0, 0, 0, .40); --sh-sm: 0 6px 18px rgba(0, 0, 0, .35);
  --sh-hi: 0 18px 44px rgba(0, 0, 0, .50); --sh-lo: 0 2px 8px rgba(0, 0, 0, .35);
  --dots: rgba(255, 255, 255, .05);
  --outer: #05070b; --bar: #10141b; --bar-ink: #e6e9f0; --bar-line: #232937;
}
:root[data-theme="carbon"] {
  --paper: #1b1c1f; --stage: #111214; --on: #111214;
  --ink: #f2f2ef; --sub: #a3a39c; --mute: #67675f; --line: #2b2c2f; --soft: #222326;
  --accent: #c6f04a; --accent-soft: #252e14; --accent-2: #56691f;
  --hl: #ffffff; --hl-ink: #111214;
  --ok: #c6f04a; --ok-soft: #252e14; --ok-ink: #c6f04a; --unk: #ff6247; --unk-soft: #2e1814; --unk-ink: #ff7d66;
  --later: #f0b64a; --later-soft: #2d2414; --later-ink: #f0b64a; --other: #9d8cff; --other-soft: #221f36;
  --bw: 1px; --bw2: 1px; --edge: #33343a; --r: 4px;
  --sh: 0 0 0 transparent; --sh-sm: 0 0 0 transparent; --sh-hi: 0 0 0 1px #c6f04a; --sh-lo: 0 0 0 transparent;
  --dots: rgba(255, 255, 255, .045);
  --outer: #0a0a0b; --bar: #161719; --bar-ink: #ecece8; --bar-line: #2b2c2f;
}
:root[data-theme="keynote"] {
  --paper: #ffffff; --stage: #f5f5f7;
  --ink: #1d1d1f; --sub: #6e6e73; --mute: #a1a1a6; --line: #e5e5ea; --soft: #f2f2f5;
  --accent: #5b5bf7; --accent-soft: #ededfe; --accent-2: #c9c8fb; --accent-fill: linear-gradient(120deg, #8a5cff, #2f7bff);
  --hl: #ffd60a; --hl-ink: #1d1d1f;
  --ok: #2fb366; --ok-soft: #e4f6ea; --unk: #ff453a; --unk-soft: #ffeceb; --unk-ink: #d7302a;
  --later: #ff9f0a; --later-soft: #fff3e0; --other: #a259ff; --other-soft: #f3eaff;
  --bw: 0px; --bw2: 1px; --edge: #e5e5ea; --r: 18px;
  --sh: 0 10px 30px rgba(0, 0, 0, .08); --sh-sm: 0 4px 14px rgba(0, 0, 0, .08);
  --sh-hi: 0 16px 40px rgba(0, 0, 0, .14); --sh-lo: 0 2px 6px rgba(0, 0, 0, .08);
  --dots: rgba(0, 0, 0, .05);
}
@media (prefers-color-scheme: dark) {
  :root { --outer: #0d0f13; --bar: #1a1d23; --bar-ink: #e8eaee; --bar-line: #2c3038; }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--outer); font-family: var(--font); color: var(--ink); }
button { font: inherit; color: inherit; cursor: pointer; }

/* ステージは1280x720で組んで、画面に合わせて拡大縮小する */
#viewport { position: fixed; inset: 0 0 64px 0; }
#stage { position: absolute; left: 50%; top: 50%; width: 1280px; height: 720px; background: var(--stage); overflow: hidden; border-radius: 6px; box-shadow: 0 14px 44px rgba(0, 0, 0, .16); }
#bg, #fx { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; pointer-events: none; }
#bg { z-index: 0; }
#fx { z-index: 12; }

/* 上の帯 */
#hud { position: absolute; left: 0; right: 0; top: 0; height: 64px; display: flex; align-items: center; gap: 24px; padding: 0 40px; z-index: 5; }
#hud .deck { font-size: 14px; font-weight: 700; letter-spacing: .04em; color: var(--sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 340px; }
#segs { flex: 1; display: flex; gap: 5px; }
#segs i { flex: 1; height: 5px; border-radius: 3px; background: var(--line); overflow: hidden; position: relative; }
#segs i b { position: absolute; inset: 0; background: var(--ink); transform: scaleX(0); transform-origin: left; }
#segs i.done b { transform: scaleX(1); }
#hud .no { font-size: 15px; font-weight: 800; color: var(--ink); font-variant-numeric: tabular-nums; white-space: nowrap; }
#foot { position: absolute; left: 40px; right: 40px; bottom: 12px; font-size: 12px; color: var(--mute); display: flex; justify-content: space-between; z-index: 5; }

/* 場面：中の要素がそれぞれ動いて入り、場面ごと出ていく */
#scenes { position: absolute; inset: 0; z-index: 2; }
.scene { position: absolute; inset: 84px 80px 56px; }
.scene.out { opacity: 0; transform: translateX(-90px) scale(.97); transition: opacity .3s ease, transform .45s cubic-bezier(.7, 0, .3, 1); pointer-events: none; }
.a { opacity: 0; transform: var(--from, translateY(40px)); transition: opacity .45s ease var(--d, 0ms), transform .8s var(--ease) var(--d, 0ms); }
.scene.in .a { opacity: 1; transform: none; }

/* 1文字ずつ飛び込む文字 */
.kin { font-weight: 800; line-height: 1.32; letter-spacing: .01em; }
.kin .w { display: inline-block; white-space: nowrap; }
.kin .c { display: inline-block; opacity: 0; transform: translateY(.7em) rotate(10deg) scale(.85); transition: opacity .3s ease, transform .65s var(--pop); transition-delay: calc(var(--d, 0ms) + var(--i) * 24ms); }
.scene.in .kin .c { opacity: 1; transform: none; }

.kicker { display: inline-flex; align-items: center; gap: 10px; font-size: 17px; font-weight: 800; letter-spacing: .14em; color: var(--ink); }
.kicker::before { content: ""; width: 28px; height: 6px; background: var(--accent); border-radius: 3px; }

/* 章の切り替え：色の帯が画面を横切る */
#stinger { position: absolute; inset: 0; z-index: 15; pointer-events: none; overflow: hidden; }
#stinger i { position: absolute; top: -12%; height: 124%; left: 0; transform: translateX(-3000px) skewX(-16deg); }
#stinger .s1 { width: 2048px; background: var(--accent-fill); --x0: -2300px; --x1: 2000px; }
#stinger .s2 { width: 220px; background: var(--ink); --x0: -312px; --x1: 3988px; }
#stinger .s3 { width: 40px; background: var(--hl); --x0: -62px; --x1: 4238px; }
#stinger .s4 { width: 200px; background: var(--ink); --x0: -2560px; --x1: 1740px; }
#stinger.go i { animation: sweep .9s cubic-bezier(.75, 0, .25, 1); }
@keyframes sweep { from { transform: translateX(var(--x0)) skewX(-16deg); } to { transform: translateX(var(--x1)) skewX(-16deg); } }

/* 表紙 */
.s-title { display: grid; grid-template-columns: 1.3fr 1fr; gap: 56px; align-items: center; }
.s-title .kin.h1 { font-size: 64px; margin: 22px 0 18px; }
.s-title .subt { font-size: 21px; color: var(--sub); line-height: 1.6; margin: 0 0 26px; }
.s-title .meta { display: flex; gap: 22px; font-size: 17px; color: var(--sub); margin-bottom: 38px; }
.s-title .meta b { color: var(--ink); font-size: 22px; }
.startbtn { position: relative; display: inline-flex; align-items: center; gap: 16px; border: var(--bw) solid var(--edge); background: var(--accent-fill); color: var(--on); padding: 18px 36px 18px 28px; border-radius: 999px; font-size: 23px; font-weight: 800; box-shadow: var(--sh); transition: transform .15s, box-shadow .15s; }
.startbtn:hover { transform: translate(-2px, -2px); box-shadow: var(--sh-hi); }
.startbtn:active { transform: translate(4px, 4px); box-shadow: var(--sh-lo); }
.startbtn .tri { width: 0; height: 0; border-left: 18px solid var(--on); border-top: 11px solid transparent; border-bottom: 11px solid transparent; }
.startbtn::after { content: ""; position: absolute; inset: -3px; border-radius: inherit; border: 3px solid var(--accent); animation: ring 2s ease-out infinite; pointer-events: none; }
@keyframes ring { from { opacity: .7; transform: scale(1); } to { opacity: 0; transform: scale(1.35); } }
.agenda { list-style: none; margin: 0; padding: 0; max-height: 500px; overflow: hidden; }
.agenda li { display: flex; gap: 16px; align-items: baseline; padding: 12px 0; border-top: var(--bw2) solid var(--edge); font-size: 20px; font-weight: 700; line-height: 1.4; --from: translateX(60px); }
.agenda li:last-child { border-bottom: var(--bw2) solid var(--edge); }
.agenda li b { color: var(--accent); font-weight: 900; font-variant-numeric: tabular-nums; min-width: 32px; }
.agenda.small li { font-size: 16px; padding: 7px 0; }

/* 論点のページ：上から 問い → 図・材料 → 選択肢 の順に出す */
.b { opacity: 0; transform: var(--from, translateY(30px)); pointer-events: none; transition: opacity .45s ease var(--d, 0ms), transform .8s var(--ease) var(--d, 0ms); }
.scene.st1 .sec1 .b, .scene.st2 .sec2 .b { opacity: 1; transform: none; pointer-events: auto; }
.s-issue { display: flex; flex-direction: column; justify-content: center; gap: 18px; }
.ihead { display: flex; align-items: center; gap: 26px; min-height: 100px; }
.roll { display: flex; font-size: 96px; font-weight: 900; line-height: 1; height: 1em; overflow: hidden; color: var(--accent); letter-spacing: -.04em; flex: none; }
.roll .col { display: block; height: 1em; overflow: hidden; }
.roll .strip { display: flex; flex-direction: column; transform: translateY(0); transition: transform 1.1s cubic-bezier(.2, .9, .1, 1); transition-delay: var(--d); }
.roll .strip span { height: 1em; line-height: 1; background: var(--accent-fill); -webkit-background-clip: text; background-clip: text; color: transparent; }
.scene.in .roll .strip { transform: translateY(calc(var(--y) * -1em)); }
.ihead .kin { max-width: 1000px; }
.mid { display: grid; gap: 28px; align-items: center; }
.box { background: var(--paper); border: var(--bw) solid var(--edge); border-radius: var(--r); padding: 16px 22px; box-shadow: var(--sh); min-width: 0; }
.box h4 { display: flex; align-items: center; gap: 8px; margin: 0 0 10px; font-size: 15px; font-weight: 900; letter-spacing: .08em; }
.box h4::before { content: ""; width: 20px; height: 5px; border-radius: 3px; background: var(--accent); }
.pts { min-width: 0; }
.li { display: flex; align-items: baseline; gap: 12px; padding: 9px 0; font-size: 22px; font-weight: 700; line-height: 1.4; --from: translateX(-24px); }
.li .tag { flex: none; font-size: 13px; font-weight: 800; background: var(--ink); color: var(--paper); padding: 3px 9px; border-radius: 5px; transform: translateY(-3px); }

/* 図：棒グラフ・円グラフ・流れ図・大きな数字 */
.bars { display: grid; gap: 10px; }
.bar { display: grid; grid-template-columns: minmax(80px, auto) 1fr auto; align-items: center; gap: 14px; font-size: 18px; font-weight: 800; }
.bar .tr { height: 28px; background: var(--soft); border-radius: 7px; overflow: hidden; }
.bar .tr i { display: block; height: 100%; background: var(--accent-2); border-radius: 7px; transform: scaleX(0); transform-origin: left; transition: transform 1.1s var(--ease) var(--d, 0ms); }
.bar.top .tr i { background: var(--accent-fill); }
.scene.st1 .bar .tr i { transform: scaleX(1); }
.bar .v { font-size: 22px; font-weight: 900; font-variant-numeric: tabular-nums; min-width: 56px; text-align: right; }
.donut { display: flex; align-items: center; gap: 28px; }
.donut svg { width: 160px; height: 160px; flex: none; transform: rotate(-90deg); }
.donut circle { fill: none; stroke-width: 28; stroke-dasharray: 0 999; transition: stroke-dasharray 1.1s var(--ease); }
.scene.st1 .donut circle { stroke-dasharray: var(--len) 999; }
.lg { display: grid; gap: 8px; font-size: 18px; font-weight: 800; }
.lg div { display: flex; align-items: center; gap: 10px; }
.lg i { width: 16px; height: 16px; border-radius: 4px; flex: none; }
.lg b { margin-left: auto; padding-left: 16px; font-size: 20px; font-variant-numeric: tabular-nums; }
.flow { display: flex; align-items: stretch; gap: 10px; }
.step { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; border: var(--bw) solid var(--edge); border-radius: var(--r); padding: 12px 8px; text-align: center; font-size: 18px; font-weight: 800; line-height: 1.3; background: var(--paper); }
.step .ico { font-size: 36px; line-height: 1.1; }
.step.at { background: var(--hl); color: var(--hl-ink); box-shadow: var(--sh-sm); }
.arw { flex: none; align-self: center; width: 0; height: 0; border-left: 14px solid var(--ink); border-top: 9px solid transparent; border-bottom: 9px solid transparent; --from: translateX(-10px); }
.stats { display: flex; align-items: flex-end; gap: 20px; }
.stat { flex: 1; min-width: 0; text-align: center; }
.stat .ico { display: block; font-size: 36px; line-height: 1.2; }
.stat .num { font-size: 68px; font-weight: 900; line-height: 1.05; color: var(--accent); font-variant-numeric: tabular-nums; white-space: nowrap; }
.stat .num small { font-size: 24px; font-weight: 800; margin-left: 3px; color: var(--ink); }
.stat > span { display: block; font-size: 17px; font-weight: 800; color: var(--sub); margin-top: 4px; }
.ill svg { display: block; width: 100%; height: auto; max-height: 240px; }
.ico svg { display: block; width: 1.1em; height: 1.1em; margin: 0 auto; overflow: visible; }
/* SVGの線は、その段が出るときに描かれていく */
.draw [pathLength] { stroke-dasharray: 1; stroke-dashoffset: 1; transition: stroke-dashoffset 1s var(--ease) calc(var(--d, 0ms) + var(--dd, 0ms)); }
.scene.st1 .sec1 .draw [pathLength], .scene.st2 .sec2 .draw [pathLength] { stroke-dashoffset: 0; }
.li .ic { flex: none; width: 24px; height: 24px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 14px; font-weight: 900; color: var(--on); transform: translateY(2px); }
.li .ic.known { background: var(--ok); }
.li .ic.unknown { background: var(--unk); }
.li.unknown { color: var(--unk-ink); }

/* 選ぶ */
.opts { display: grid; gap: 18px; }
.opt { position: relative; text-align: center; background: var(--paper); border: var(--bw) solid var(--edge); border-radius: var(--r); padding: 12px 16px 14px; box-shadow: var(--sh); --from: translateY(90px) scale(.9) rotate(-3deg); transition: opacity .45s ease var(--d, 0ms), transform .8s var(--pop) var(--d, 0ms), background .2s, color .2s; }
.scene.in .opt:hover { transform: translate(-3px, -3px); transition-delay: 0ms; }
.opt .k { position: absolute; left: 10px; top: 10px; display: inline-grid; place-items: center; width: 32px; height: 32px; border-radius: 8px; background: var(--ink); color: var(--paper); font-size: 17px; font-weight: 900; }
.opt .ico { display: block; font-size: 52px; line-height: 1.15; }
.opt .ico.letter { font-weight: 900; color: var(--accent); }
.opt .lb { display: block; font-size: 24px; font-weight: 800; line-height: 1.3; margin-top: 2px; }
.opt .nt { display: block; font-size: 15px; font-weight: 600; color: var(--sub); line-height: 1.4; margin-top: 2px; }
/* 読み上げ中の選択肢 */
.scene.in .opt.say { transform: translate(-3px, -4px); box-shadow: 0 0 0 5px var(--hl), var(--sh); transition-delay: 0ms; }
.scene.in .opt.sel { background: var(--accent-fill); color: var(--on); transform: translate(-4px, -6px) scale(1.04); transition-delay: 0ms; }
.opt.sel .k { background: var(--paper); color: var(--accent); }
.opt.sel .ico.letter { color: var(--on); }
/* 選んだカードの上では、アクセント色の部分を文字色にして沈まないようにする */
.opt.sel .cf-accent { fill: var(--on) !important; }
.opt.sel .cs-accent { stroke: var(--on) !important; }

        var v = +x.value || 0, len = v / sum * C, c = document.createElementNS(SVGNS, 'circle');
        c.setAttribute('cx', 80); c.setAttribute('cy', 80); c.setAttribute('r', 60);
        c.style.stroke = pal(k); c.style.strokeDashoffset = -acc;
        c.style.setProperty('--len', len); c.style.transitionDelay = (250 + k * 160) + 'ms';
        acc += len; svg.append(c);
        var row = el('div'), sw = el('i'); sw.style.background = pal(k);
        row.append(sw, el('span', null, x.label), el('b', null, f.unit ? x.value + f.unit : Math.round(v / sum * 100) + '%'));
        lg.append(row);
      });
      w.append(svg, lg); box.append(w);
    } else if (f.type === 'flow') {
      var w = el('div', 'flow');
      (f.steps || []).forEach(function (s, k) {
        if (typeof s === 'string') s = { label: s };
        if (k) w.append(bd(el('i', 'arw b'), 200 + k * 180 - 90));
        var st = bd(el('div', 'step b' + (f.at === k ? ' at' : '')), 200 + k * 180);
        if (s.icon) st.append(icon(s.icon));
        st.append(el('span', null, s.label));
        w.append(st);
      });
      box.append(w);
    } else if (f.type === 'stats') {
      var w = el('div', 'stats');
      data.forEach(function (x, k) {
        var s = bd(el('div', 'stat b'), 200 + k * 130), num = el('div', 'num'), v = el('b'), str = String(x.value);
        // 整数なら数え上げる
        if (/^\d+$/.test(str)) { v.textContent = '0'; v.dataset.to = str; } else v.textContent = str;
        num.append(v);
        if (x.unit) num.append(el('small', null, x.unit));
        if (x.icon) s.append(icon(x.icon));
        s.append(num, el('span', null, x.label));
        w.append(s);
      });
      box.append(w);
    }
    return box;
  }
  function countUp(sc) {
    var ns = sc.querySelectorAll('[data-to]'), t0 = performance.now() + 350;
    (function tick(now) {
      var k = Math.max(0, Math.min(1, (now - t0) / 700)), e = 1 - Math.pow(1 - k, 3);
      for (var i = 0; i < ns.length; i++) ns[i].textContent = Math.round(+ns[i].dataset.to * e);
      if (k < 1) requestAnimationFrame(tick);
    })(performance.now());
  }

  function status(i) {
    var x = answers[i];
    if (!x) return { cls: 'open', text: T.open };
    if (x.choice === 'later') return { cls: 'later', text: T.later };
    if (x.choice === 'other') return { cls: 'other', text: T.other + (x.memo ? T.sep + x.memo : '') };
    var o = items[i].options.filter(function (y) { return y.key === x.choice; })[0];
    return { cls: 'done', text: x.choice + '. ' + (o ? o.label : '') };
  }
  function rowFor(i, onclick) {
    var st = status(i), row = el('button', 'row');
    row.append(el('span', 'n', i < 0 || i >= N ? '' : pad(i + 1)), el('span', 't', i < 0 ? T.cover : i >= N ? T.summary : flat(items[i].title)));
    if (i >= 0 && i < N) row.append(el('span', 'chip ' + st.cls, st.text));
    row.onclick = onclick;
    return row;
  }

  function issueScene() { var sc = scenes.lastElementChild; return sc && sc.classList.contains('s-issue') && !sc.classList.contains('out') ? sc : null; }
  function choiceScene() { var sc = issueScene(); return sc && sc.classList.contains('st2') ? sc : null; }
  function paintChoice() {
    var sc = choiceScene(); if (!sc) return;
    var x = answers[S.pos];
    var bs = sc.querySelectorAll('.opt, .alt');
    for (var i = 0; i < bs.length; i++) bs[i].classList.toggle('sel', !!x && bs[i].dataset.key === x.choice);
    $('.opts', sc).classList.toggle('chosen', !!x);
    // メモ欄は最初から出しておき、先に書いてから選べるようにする
    var panel = $('.panel', sc), inp = $('input', panel);
    panel.classList.add('show');
    panel.classList.toggle('done', !!x);
    $('.res', panel).textContent = !x ? T.memoTag : x.choice === 'other' ? T.other : status(S.pos).text;
    inp.placeholder = x && x.choice === 'other' ? T.otherMemo : T.memo;
    if (document.activeElement !== inp) inp.value = x ? x.memo || '' : drafts[S.pos] || '';
  }
  var drafts = {};
  function choose(key, btn) {
    var sc = choiceScene(); if (!sc) return;
    var inp = $('.panel input', sc), pos = S.pos, tok = S.token;
    answers[pos] = { choice: key, memo: inp ? inp.value : (answers[pos] || {}).memo || '' };
    save();
    stopReading();
    hush();
    sfx(key === 'later' ? 'later' : 'pick');
    paintChoice(); updateBar(); updateDrawer();
    btn = btn || sc.querySelector('[data-key="' + key + '"]');
    if (btn && key !== 'later') {
      var st = $('#stage').getBoundingClientRect(), r = btn.getBoundingClientRect(), k = st.width / 1280;
      var x = (r.left + r.width / 2 - st.left) / k, y = (r.top + r.height / 2 - st.top) / k;
      burst(x, y, key === 'other' ? [C.other, C.hl, C.ink] : [C.accent, C.hl, C.ok, C.unk, C.ink]);
      pulse(x, y);
    }
    if (key === 'other' && !answers[pos].memo.trim()) { setTimeout(function () { if (inp) inp.focus(); }, 50); return; }
    // 決まった演出を少し見せてから次の論点へ
    setTimeout(function () { if (tok === S.token && answers[pos] && answers[pos].choice === key) commit(); }, 750);
  }
  function commit() {
    var x = answers[S.pos];
    if (!x) { sfx('tick'); return toast(T.pick); }
    var sc = choiceScene(), inp = sc && $('.panel input', sc);
    if (x.choice === 'other' && !String(x.memo || '').trim()) { if (inp) { inp.classList.remove('bad'); inp.getBoundingClientRect(); inp.classList.add('bad'); inp.focus(); } return; }
    if (inp) inp.blur();
    go(S.pos + 1, 0, true);
  }

  function summaryText() {
    var out = ['【' + flat(D.title) + '】' + T.head + (D.date ? T.paren(D.date) : '')], dec = [], lat = [], opn = [];
    items.forEach(function (it, i) {
      var x = answers[i];
      if (!x) opn.push(i); else if (x.choice === 'later') lat.push(i); else dec.push(i);
    });
    if (dec.length) {
      out.push('', T.decided);
      dec.forEach(function (i, n) {
        var x = answers[i];
        out.push((n + 1) + '. ' + flat(items[i].title) + T.sep + status(i).text);
        if (x.choice !== 'other' && x.memo) out.push('   ' + T.note + x.memo);
      });
    }
    if (lat.length) {
      out.push('', T.laterH);
      lat.forEach(function (i) { var m = answers[i].memo; out.push('・' + flat(items[i].title) + (m ? T.paren(m) : '')); });
    }
    if (opn.length) {
      out.push('', T.openH);
      opn.forEach(function (i) { out.push('・' + flat(items[i].title)); });
    }
    return out.join('\n');
  }
  function copy(text) {
    function fallback() {
      var ta = el('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.append(ta); ta.select();
      try { document.execCommand('copy'); } catch (e) {}
      ta.remove(); done();
    }
    function done() { sfx('pop'); toast(T.copied); }
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(done, fallback);
    else fallback();
  }

  // ---- 上の帯・下のバー・目次 ----
  function hud() {
    $('#hud .deck').textContent = flat(D.title);
    var segs = $('#segs'); segs.innerHTML = '';
    var inChapter = S.pos >= 0 && S.pos < N;
    $('#hud .no').textContent = inChapter ? pad(S.pos + 1) + ' / ' + pad(N) : '';
    $('#foot .l').textContent = D.footer || '';
    if (!inChapter) return;
    beatsOf(S.pos).forEach(function (b, k) {
      var s = el('i', k < S.beat ? 'done' : ''); s.append(el('b')); segs.append(s);
    });
  }
  function fillSeg(full, ms) {
    var s = $('#segs').children[S.beat]; if (!s) return;
    var b = s.firstChild;
    b.style.transition = 'none'; b.style.transform = full ? 'scaleX(1)' : 'scaleX(0)';
    if (ms) { b.getBoundingClientRect(); b.style.transition = 'transform ' + ms + 'ms linear'; b.style.transform = 'scaleX(1)'; }
  }
  var ICON_PLAY = '<svg viewBox="0 0 24 24"><path d="M7 4v16l13-8z"/></svg>';
  var ICON_PAUSE = '<svg viewBox="0 0 24 24"><path d="M6 4h4v16H6zm8 0h4v16h-4z"/></svg>';
  function updateBar() {
    $('#bPlay').innerHTML = S.playing ? ICON_PAUSE : ICON_PLAY;
    $('#bNarr').classList.toggle('off', !S.narr);
    $('#bSe').classList.toggle('off', !S.se);
    $('#bNarr .lbl').textContent = T.narr + (S.narr ? ' ON' : ' OFF');
    $('#bSe .lbl').textContent = T.se + (S.se ? ' ON' : ' OFF');
    $('#bMenu .lbl').textContent = T.menu;
    var dots = $('#dots');
    if (dots.children.length !== N) {
      dots.innerHTML = '';
      items.forEach(function (it, i) {
        var d = el('button', null, String(i + 1)); d.title = flat(it.title);
        d.onclick = function () { audio(); go(i, 0, true); };
        dots.append(d);
      });
    }
    for (var i = 0; i < N; i++) dots.children[i].className = status(i).cls + (i === S.pos ? ' cur' : '');
  }
  function updateDrawer() {
    var dr = $('#drawer'); if (!dr.classList.contains('open')) return;
    dr.innerHTML = ''; dr.append(el('h3', null, T.menu));
    for (var i = -1; i <= N; i++) {
      (function (i) {
        var row = rowFor(i, function () { dr.classList.remove('open'); audio(); go(i, 0, i >= 0 && i < N); });
        if (i === S.pos) row.classList.add('cur');
        dr.append(row);
      })(i);
    }
  }
  function toggleMenu() { var dr = $('#drawer'); dr.classList.toggle('open'); updateDrawer(); }

  $('#bPlay').onclick = togglePlay;
  $('#bSkip').onclick = skip;
  $('#bPrev').onclick = prevChapter;
  $('#bMenu').onclick = toggleMenu;
  $('#bNarr').onclick = function () { S.narr = !S.narr; if (!S.narr) hush(); updateBar(); if (S.playing) go(S.pos, S.beat, true); };
  $('#bSe').onclick = function () { S.se = !S.se; updateBar(); };
  $('#voiceSel').onchange = function () {
    var name = this.value;
    useCloud = name === CLOUD;
    try { if (HAS_CLOUD) localStorage.setItem(CLOUD_KEY, useCloud ? '1' : '0'); } catch (e) {}
    if (!useCloud) {
      voice = voices.filter(function (v) { return v.name === name; })[0] || voice;
      try { localStorage.setItem(VOICE_KEY, name); } catch (e) {}
    }
    this.blur();
    if (!S.narr) { S.narr = true; updateBar(); }
    hush();
    if (S.playing) go(S.pos, S.beat, true);
    else speak(useCloud ? Object.keys(AUDIO)[0] : T.sayVoice, function () {});
  };
  $('#bFull').onclick = function () {
    if (document.fullscreenElement) document.exitFullscreen();
    else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
  };
  document.addEventListener('keydown', function (e) {
    if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.metaKey || e.ctrlKey || e.altKey) return;
    var b = cur(), k = e.key;
    if (k === ' ') { e.preventDefault(); togglePlay(); }
    else if (k === 'ArrowRight') skip();
    else if (k === 'ArrowLeft') prevChapter();
    else if (k === 'Enter' && b.wait) commit();
    else if (k === 'Enter' && b.scene === 'title') start();
    else if (k === 'm' || k === 'M') toggleMenu();
    else if (k === 'v' || k === 'V') $('#bNarr').click();
    else if (k === 's' || k === 'S') $('#bSe').click();
    else if (k === 'f' || k === 'F') $('#bFull').click();
    else if (k === 'Escape') $('#drawer').classList.remove('open');
    else if (k === 't' || k === 'T') { applyTheme(THEMES[(THEMES.indexOf(theme) + 1) % THEMES.length]); toast((LANG === 'en' ? 'Theme: ' : 'テーマ：') + (LANG === 'en' ? theme : THEME_NAMES[theme])); }
    else if (b.wait && /^[1-9]$/.test(k)) {
      var it = items[S.pos], n = +k - 1, keys = it.options.map(function (o) { return o.key; }).concat(['other', 'later']);
      if (keys[n]) { e.preventDefault(); choose(keys[n]); }
    }
  });

  function fit() {
    var W = innerWidth, H = innerHeight - 64, s = Math.min(W / 1280, H / 720) * .96;
    $('#stage').style.transform = 'translate(-50%, -50%) scale(' + s + ')';
    // 拡大しても線がにじまないよう、キャンバスは表示の大きさに合わせて描く
    RES = Math.max(1, Math.min(2, s * (window.devicePixelRatio || 1)));
    [bg, fx].forEach(function (c) { c.width = Math.round(1280 * RES); c.height = Math.round(720 * RES); });
    drawBg(performance.now());
  }
  addEventListener('resize', fit);
  if ('speechSynthesis' in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; } else fillVoiceSel();
  fit();
  requestAnimationFrame(loop);
  document.title = flat(D.title) || 'decide-reel';
  go(-1, 0, false);
})();
</script>
