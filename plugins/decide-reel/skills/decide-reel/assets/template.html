<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>decide-reel</title>
<style>
:root {
  --ink: #111318;
  --sub: #5b6170;
  --mute: #9aa0ac;
  --line: #e6e8ed;
  --soft: #f4f5f8;
  --accent: #2b59ff;
  --accent-soft: #e8eeff;
  --hl: #ffd84d;
  --ok: #10b06f;
  --ok-soft: #e3f7ee;
  --unk: #ff5a5f;
  --unk-soft: #ffeced;
  --later: #e8930c;
  --later-soft: #fdf2df;
  --other: #8b5cf6;
  --other-soft: #f1ebfe;
  --outer: #e9ebef;
  --bar: #ffffff;
  --bar-ink: #16181d;
  --bar-line: #dfe2e7;
  --ease: cubic-bezier(.16, 1, .3, 1);
  --pop: cubic-bezier(.2, 1.5, .4, 1);
  --font: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic UI", "Meiryo", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root { --outer: #0d0f13; --bar: #1a1d23; --bar-ink: #e8eaee; --bar-line: #2c3038; }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--outer); font-family: var(--font); color: var(--ink); }
button { font: inherit; color: inherit; cursor: pointer; }

/* ステージは1280x720で組んで、画面に合わせて拡大縮小する */
#viewport { position: fixed; inset: 0 0 64px 0; }
#stage { position: absolute; left: 50%; top: 50%; width: 1280px; height: 720px; background: #fff; overflow: hidden; border-radius: 6px; box-shadow: 0 14px 44px rgba(0, 0, 0, .16); }
#bg, #fx { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; pointer-events: none; }
#bg { z-index: 0; }
#fx { z-index: 12; }

/* 上の帯 */
#hud { position: absolute; left: 0; right: 0; top: 0; height: 64px; display: flex; align-items: center; gap: 24px; padding: 0 40px; z-index: 5; }
#hud .deck { font-size: 14px; font-weight: 700; letter-spacing: .04em; color: var(--sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 340px; }
#segs { flex: 1; display: flex; gap: 5px; }
#segs i { flex: 1; height: 5px; border-radius: 3px; background: var(--line); overflow: hidden; position: relative; }
#segs i b { position: absolute; inset: 0; background: var(--ink); transform: scaleX(0); transform-origin: left; }
#segs i.done b { transform: scaleX(1); }
#hud .no { font-size: 15px; font-weight: 800; color: var(--ink); font-variant-numeric: tabular-nums; white-space: nowrap; }
#foot { position: absolute; left: 40px; right: 40px; bottom: 12px; font-size: 12px; color: var(--mute); display: flex; justify-content: space-between; z-index: 5; }

/* 場面：中の要素がそれぞれ動いて入り、場面ごと出ていく */
#scenes { position: absolute; inset: 0; z-index: 2; }
.scene { position: absolute; inset: 84px 80px 56px; }
.scene.out { opacity: 0; transform: translateX(-90px) scale(.97); transition: opacity .3s ease, transform .45s cubic-bezier(.7, 0, .3, 1); pointer-events: none; }
.a { opacity: 0; transform: var(--from, translateY(40px)); transition: opacity .45s ease var(--d, 0ms), transform .8s var(--ease) var(--d, 0ms); }
.scene.in .a { opacity: 1; transform: none; }

/* 1文字ずつ飛び込む文字 */
.kin { font-weight: 800; line-height: 1.32; letter-spacing: .01em; }
.kin .w { display: inline-block; white-space: nowrap; }
.kin .c { display: inline-block; opacity: 0; transform: translateY(.7em) rotate(10deg) scale(.85); transition: opacity .3s ease, transform .65s var(--pop); transition-delay: calc(var(--d, 0ms) + var(--i) * 24ms); }
.scene.in .kin .c { opacity: 1; transform: none; }

.kicker { display: inline-flex; align-items: center; gap: 10px; font-size: 17px; font-weight: 800; letter-spacing: .14em; color: var(--ink); }
.kicker::before { content: ""; width: 28px; height: 6px; background: var(--accent); border-radius: 3px; }
.ghost { position: absolute; font-weight: 900; line-height: .8; color: transparent; -webkit-text-stroke: 2px rgba(43, 89, 255, .14); pointer-events: none; user-select: none; z-index: -1; animation: drift 14s ease-in-out infinite alternate; }
@keyframes drift { to { transform: translate(-40px, 16px); } }

/* 章の切り替え：色の帯が画面を横切る */
#stinger { position: absolute; inset: 0; z-index: 15; pointer-events: none; overflow: hidden; }
#stinger i { position: absolute; top: -12%; height: 124%; left: 0; transform: translateX(-3000px) skewX(-16deg); }
#stinger .s1 { width: 2048px; background: var(--accent); --x0: -2300px; --x1: 2000px; }
#stinger .s2 { width: 220px; background: var(--ink); --x0: -312px; --x1: 3988px; }
#stinger .s3 { width: 40px; background: var(--hl); --x0: -62px; --x1: 4238px; }
#stinger .s4 { width: 200px; background: var(--ink); --x0: -2560px; --x1: 1740px; }
#stinger.go i { animation: sweep .9s cubic-bezier(.75, 0, .25, 1); }
@keyframes sweep { from { transform: translateX(var(--x0)) skewX(-16deg); } to { transform: translateX(var(--x1)) skewX(-16deg); } }

/* 表紙 */
.s-title { display: grid; grid-template-columns: 1.3fr 1fr; gap: 56px; align-items: center; }
.s-title .kin.h1 { font-size: 64px; margin: 22px 0 18px; }
.s-title .subt { font-size: 21px; color: var(--sub); line-height: 1.6; margin: 0 0 26px; }
.s-title .meta { display: flex; gap: 22px; font-size: 17px; color: var(--sub); margin-bottom: 38px; }
.s-title .meta b { color: var(--ink); font-size: 22px; }
.startbtn { position: relative; display: inline-flex; align-items: center; gap: 16px; border: 3px solid var(--ink); background: var(--accent); color: #fff; padding: 18px 36px 18px 28px; border-radius: 999px; font-size: 23px; font-weight: 800; box-shadow: 6px 6px 0 var(--ink); transition: transform .15s, box-shadow .15s; }
.startbtn:hover { transform: translate(-2px, -2px); box-shadow: 8px 8px 0 var(--ink); }
.startbtn:active { transform: translate(4px, 4px); box-shadow: 2px 2px 0 var(--ink); }
.startbtn .tri { width: 0; height: 0; border-left: 18px solid #fff; border-top: 11px solid transparent; border-bottom: 11px solid transparent; }
.startbtn::after { content: ""; position: absolute; inset: -3px; border-radius: inherit; border: 3px solid var(--accent); animation: ring 2s ease-out infinite; pointer-events: none; }
@keyframes ring { from { opacity: .7; transform: scale(1); } to { opacity: 0; transform: scale(1.35); } }
.agenda { list-style: none; margin: 0; padding: 0; max-height: 500px; overflow: hidden; }
.agenda li { display: flex; gap: 16px; align-items: baseline; padding: 12px 0; border-top: 2px solid var(--ink); font-size: 20px; font-weight: 700; line-height: 1.4; --from: translateX(60px); }
.agenda li:last-child { border-bottom: 2px solid var(--ink); }
.agenda li b { color: var(--accent); font-weight: 900; font-variant-numeric: tabular-nums; min-width: 32px; }
.agenda.small li { font-size: 16px; padding: 7px 0; }

/* 章の扉 */
.s-cover { display: flex; flex-direction: column; justify-content: center; }
.s-cover .ghost { right: -40px; bottom: -60px; font-size: 560px; }
.roll { display: flex; font-size: 190px; font-weight: 900; line-height: 1; height: 1em; overflow: hidden; color: var(--accent); letter-spacing: -.04em; }
.roll .col { display: block; height: 1em; overflow: hidden; }
.roll .strip { display: flex; flex-direction: column; transform: translateY(0); transition: transform 1.1s cubic-bezier(.2, .9, .1, 1); transition-delay: var(--d); }
.roll .strip span { height: 1em; line-height: 1; }
.scene.in .roll .strip { transform: translateY(calc(var(--y) * -1em)); }
.s-cover .of { font-size: 18px; font-weight: 800; letter-spacing: .2em; margin: 20px 0 12px; }
.s-cover .kin { font-size: 64px; max-width: 1060px; }
.slash { margin-top: 28px; height: 10px; width: 180px; background: var(--ink); transform: scaleX(0) skewX(-20deg); transform-origin: left; transition: transform .7s var(--ease) var(--d); }
.slash::after { content: ""; display: block; width: 50px; height: 10px; margin-left: 196px; background: var(--hl); }
.scene.in .slash { transform: scaleX(1) skewX(-20deg); }

/* 決めること */
.s-question { display: flex; flex-direction: column; justify-content: center; }
.s-question .ghost { right: -20px; top: -70px; font-size: 520px; }
.s-question .kin { margin-top: 22px; max-width: 1060px; }
.uline { margin-top: 22px; height: 14px; width: 100%; max-width: 760px; background: var(--hl); transform: scaleX(0); transform-origin: left; transition: transform .8s var(--ease) var(--d); }
.scene.in .uline { transform: scaleX(1); }
.s-question .ctx { margin-top: 22px; font-size: 22px; font-weight: 600; color: var(--sub); line-height: 1.6; max-width: 980px; }

/* 1つずつ大きく：資料の言い分・わかっていること */
.s-claim, .s-fact { display: flex; flex-direction: column; justify-content: center; }
.shotlbl { position: absolute; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: center; }
.shotlbl .cnt { font-size: 18px; font-weight: 900; font-variant-numeric: tabular-nums; }
.shotlbl .cnt i { font-style: normal; color: var(--mute); }
.quote { font-size: 200px; font-weight: 900; line-height: .6; height: 90px; color: var(--accent); --from: scale(.3) rotate(-20deg); transition-timing-function: ease, var(--pop); }
.src { display: inline-block; align-self: flex-start; background: var(--ink); color: #fff; font-size: 20px; font-weight: 800; padding: 8px 18px; border-radius: 6px; margin: 6px 0 22px; --from: translateX(-80px); }
.s-fact .frow { display: flex; align-items: center; gap: 44px; }
.badge { position: relative; flex: none; width: 150px; height: 150px; border-radius: 50%; display: grid; place-items: center; font-size: 84px; font-weight: 900; color: #fff; --from: scale(0) rotate(-90deg); transition-timing-function: ease, var(--pop); }
.badge.known { background: var(--ok); }
.badge.unknown { background: var(--unk); }
.badge::after { content: ""; position: absolute; inset: -14px; border-radius: 50%; border: 4px solid currentColor; opacity: 0; }
.badge.known::after { color: var(--ok); }
.badge.unknown::after { color: var(--unk); }
.scene.in .badge::after { animation: ring 1.2s ease-out .35s 2; }
.s-fact .kin { flex: 1; }

/* 選ぶ */
.s-choice .top { display: flex; align-items: baseline; gap: 22px; }
.s-choice .remind { font-size: 32px; font-weight: 800; line-height: 1.35; margin: 10px 0 14px; }
.recap { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
.recap span { font-size: 15px; font-weight: 700; padding: 5px 12px; border-radius: 999px; white-space: nowrap; }
.recap .known { background: var(--ok-soft); color: #08754a; }
.recap .unknown { background: var(--unk-soft); color: #c4383d; }
.recap .more { background: var(--soft); color: var(--sub); }
.opts { display: grid; gap: 20px; }
.opt { position: relative; text-align: left; background: #fff; border: 3px solid var(--ink); border-radius: 16px; padding: 18px 20px 20px; box-shadow: 6px 6px 0 var(--ink); --from: translateY(90px) scale(.9) rotate(-3deg); transition: opacity .45s ease var(--d, 0ms), transform .8s var(--pop) var(--d, 0ms), background .2s, color .2s; }
.scene.in .opt:hover { transform: translate(-3px, -3px); transition-delay: 0ms; }
.opt .k { display: inline-grid; place-items: center; width: 54px; height: 54px; border-radius: 12px; background: var(--ink); color: #fff; font-size: 30px; font-weight: 900; margin-bottom: 12px; }
.opt .lb { display: block; font-size: 25px; font-weight: 800; line-height: 1.35; }
.opt .nt { display: block; font-size: 16px; font-weight: 600; color: var(--sub); line-height: 1.5; margin-top: 8px; }
.scene.in .opt.sel { background: var(--accent); color: #fff; transform: translate(-4px, -6px) scale(1.04); transition-delay: 0ms; }
.opt.sel .k { background: #fff; color: var(--accent); }
.opt.sel .nt { color: rgba(255, 255, 255, .85); }
.scene.in .opts.chosen .opt:not(.sel) { opacity: .3; transform: scale(.95); transition-delay: 0ms; }
.stamp { position: absolute; right: 14px; top: -16px; background: var(--hl); color: var(--ink); border: 3px solid var(--ink); font-size: 16px; font-weight: 900; border-radius: 8px; padding: 2px 10px; transform: rotate(10deg) scale(2.2); opacity: 0; transition: transform .35s var(--pop), opacity .15s; }
.opt.sel .stamp { transform: rotate(10deg) scale(1); opacity: 1; }
.alts { display: flex; gap: 14px; margin-top: 22px; }
.alt { border: 3px dashed var(--mute); background: #fff; border-radius: 999px; padding: 10px 24px; font-size: 19px; font-weight: 800; color: var(--sub); transition: background .2s, color .2s, border-color .2s, opacity .3s, transform .3s var(--pop); }
.alt:hover { border-color: var(--ink); color: var(--ink); }
.alt .k { display: inline-block; min-width: 22px; color: var(--mute); margin-right: 6px; font-variant-numeric: tabular-nums; }
.alt.sel.other { border: 3px solid var(--ink); background: var(--other); color: #fff; transform: scale(1.06); }
.alt.sel.later { border: 3px solid var(--ink); background: var(--later); color: #fff; transform: scale(1.06); }
.alt.sel .k { color: rgba(255, 255, 255, .8); }
.opts.chosen ~ .alts .alt:not(.sel) { opacity: .35; }
.panel { display: flex; align-items: center; gap: 14px; margin-top: 18px; padding: 12px 14px; background: var(--ink); color: #fff; border-radius: 14px; visibility: hidden; opacity: 0; transform: translateY(24px); transition: opacity .3s, transform .5s var(--ease), visibility 0s .3s; }
.panel.show { visibility: visible; opacity: 1; transform: none; transition-delay: 0s; }
.panel .res { flex: none; font-size: 19px; font-weight: 900; max-width: 360px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--hl); }
.panel input { flex: 1; min-width: 0; font: inherit; font-size: 18px; padding: 11px 14px; border: 2px solid transparent; border-radius: 10px; background: #fff; color: var(--ink); outline: none; }
.panel input:focus { border-color: var(--hl); }
.panel input.bad { border-color: var(--unk); animation: shake .35s; }
.panel .go { flex: none; border: 0; background: var(--hl); color: var(--ink); border-radius: 10px; padding: 12px 22px; font-size: 19px; font-weight: 900; }
@keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }

/* まとめ */
.s-summary .head { display: flex; align-items: flex-end; justify-content: space-between; gap: 30px; margin-bottom: 20px; }
.s-summary .kin { font-size: 40px; margin-top: 10px; }
.cnts { display: flex; gap: 14px; }
.cntbox { width: 128px; border: 3px solid var(--ink); border-radius: 14px; padding: 10px 14px; box-shadow: 5px 5px 0 var(--ink); --from: translateY(50px) scale(.8); transition-timing-function: ease, var(--pop); }
.cntbox b { display: block; font-size: 46px; font-weight: 900; line-height: 1; font-variant-numeric: tabular-nums; }
.cntbox span { font-size: 14px; font-weight: 800; }
.cntbox.done b { color: var(--ok); }
.cntbox.later b { color: var(--later); }
.cntbox.open b { color: var(--mute); }
.sumgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 34px; }
.rows { max-height: 400px; overflow: auto; }
.rows.dense .row { padding: 6px 4px; font-size: 15px; }
.row { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; background: none; border: 0; border-top: 2px solid var(--line); padding: 11px 4px; font-size: 17px; font-weight: 700; --from: translateX(-50px); }
.row:hover { background: var(--soft); }
.row .n { color: var(--accent); font-weight: 900; font-variant-numeric: tabular-nums; }
.row .t { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chip { flex: none; font-size: 14px; font-weight: 800; border-radius: 999px; padding: 4px 12px; max-width: 240px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chip.done { background: var(--ok-soft); color: #08754a; }
.chip.other { background: var(--other-soft); color: var(--other); }
.chip.later { background: var(--later-soft); color: #a8670a; }
.chip.open { background: var(--soft); color: var(--mute); }
.copybox { display: flex; flex-direction: column; gap: 14px; --from: translateX(60px); }
.copybox pre { margin: 0; background: var(--soft); border-radius: 14px; padding: 18px 20px; font-family: var(--font); font-size: 15px; line-height: 1.7; white-space: pre-wrap; overflow: auto; height: 330px; }
.copybox .acts { display: flex; gap: 12px; }
.copybtn { border: 3px solid var(--ink); background: var(--accent); color: #fff; border-radius: 12px; padding: 11px 22px; font-size: 18px; font-weight: 900; box-shadow: 4px 4px 0 var(--ink); }
.copybtn:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 var(--ink); }
.ghostbtn { border: 2px solid var(--line); background: #fff; border-radius: 12px; padding: 10px 18px; font-size: 15px; font-weight: 700; color: var(--sub); }

/* 目次 */
#drawer { position: absolute; top: 0; right: 0; bottom: 0; width: 420px; background: #fff; border-left: 3px solid var(--ink); z-index: 20; padding: 28px 24px; overflow: auto; transform: translateX(105%); transition: transform .4s var(--ease); }
#drawer.open { transform: none; }
#drawer h3 { margin: 0 0 12px; font-size: 15px; letter-spacing: .14em; }
#drawer .row { --from: none; opacity: 1; transform: none; }
#drawer .row.cur { background: var(--accent-soft); }

#toast { position: absolute; left: 50%; bottom: 64px; transform: translate(-50%, 20px); background: var(--ink); color: #fff; padding: 12px 22px; border-radius: 999px; font-size: 17px; font-weight: 700; opacity: 0; transition: opacity .25s, transform .3s; z-index: 30; pointer-events: none; }
#toast.show { opacity: 1; transform: translate(-50%, 0); }

/* 下の操作バー（ステージの外） */
#bar { position: fixed; left: 0; right: 0; bottom: 0; height: 64px; background: var(--bar); color: var(--bar-ink); border-top: 1px solid var(--bar-line); display: flex; align-items: center; gap: 8px; padding: 0 16px; }
#bar .grp { display: flex; align-items: center; gap: 4px; }
#bar .sp { flex: 1; min-width: 8px; }
.bb { border: 0; background: none; border-radius: 10px; height: 40px; min-width: 40px; padding: 0 10px; display: inline-flex; align-items: center; gap: 6px; font-size: 14px; }
.bb:hover { background: rgba(127, 127, 127, .14); }
.bb svg { width: 20px; height: 20px; fill: currentColor; }
.bb.off { opacity: .45; }
.bb.play { background: var(--accent); color: #fff; min-width: 48px; }
#voiceSel { height: 34px; max-width: 190px; border: 1px solid var(--bar-line); border-radius: 8px; background: var(--bar); color: var(--bar-ink); font: inherit; font-size: 13px; padding: 0 6px; }
#voiceSel:disabled { opacity: .45; }
#dots { display: flex; gap: 6px; padding: 4px; overflow-x: auto; scrollbar-width: none; }
#dots button { flex: none; width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--bar-line); background: none; font-size: 12px; font-weight: 800; color: var(--bar-ink); font-variant-numeric: tabular-nums; }
#dots button.done { background: var(--ok); border-color: var(--ok); color: #fff; }
#dots button.other { background: var(--other); border-color: var(--other); color: #fff; }
#dots button.later { background: var(--later); border-color: var(--later); color: #fff; }
#dots button.cur { box-shadow: 0 0 0 3px var(--accent); }
@media (max-width: 720px) { .bb .lbl { display: none; } #voiceSel { max-width: 110px; } }
@media (max-width: 520px) { #dots { display: none; } }

@media (prefers-reduced-motion: reduce) {
  .a, .kin .c, .roll .strip, .slash, .uline, .opt { transition-duration: .01ms !important; transition-delay: 0ms !important; }
  .ghost, .startbtn::after, .scene.in .badge::after { animation: none; }
}
</style>
</head>
<body>
<div id="viewport">
  <div id="stage">
    <canvas id="bg" width="1280" height="720"></canvas>
    <div id="hud"><div class="deck"></div><div id="segs"></div><div class="no"></div></div>
    <div id="scenes"></div>
    <div id="foot"><span class="l"></span><span class="r2"></span></div>
    <canvas id="fx" width="1280" height="720"></canvas>
    <div id="stinger"><i class="s4"></i><i class="s1"></i><i class="s2"></i><i class="s3"></i></div>
    <div id="drawer"></div>
    <div id="toast"></div>
  </div>
</div>
<div id="bar">
  <div class="grp">
    <button class="bb" id="bPrev" title="前の論点（←）"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
    <button class="bb play" id="bPlay" title="再生／一時停止（Space）"><svg viewBox="0 0 24 24"><path d="M7 4v16l13-8z"/></svg></button>
    <button class="bb" id="bSkip" title="選ぶ画面へ／次の論点へ（→）"><svg viewBox="0 0 24 24"><path d="M4 5v14l11-7zM16 5h2v14h-2z"/></svg></button>
  </div>
  <div class="sp"></div>
  <div id="dots"></div>
  <div class="sp"></div>
  <div class="grp">
    <button class="bb" id="bMenu" title="目次（M）"><svg viewBox="0 0 24 24"><path d="M4 6h16v2H4zm0 5h16v2H4zm0 5h16v2H4z"/></svg><span class="lbl"></span></button>
    <button class="bb" id="bNarr" title="ナレーション（V）"><svg viewBox="0 0 24 24"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.9V22h2v-3.1a7 7 0 0 0 6-6.9z"/></svg><span class="lbl"></span></button>
    <select id="voiceSel" title="声の種類"></select>

      var meta = a(el('div', 'meta'), 680);
      if (D.date) meta.append(el('span', null, D.date));
      var c = el('span', null, T.count + ' '); c.append(el('b', null, N + T.items)); meta.append(c);
      L.append(meta);
      var sb = a(el('button', 'startbtn'), 820, 'scale(.6)'); sb.append(el('span', 'tri'), el('span', null, T.start)); sb.onclick = start;
      L.append(sb);
      var ol = el('ol', 'agenda' + (N > 7 ? ' small' : ''));
      items.forEach(function (x, i) { var li = a(el('li'), 300 + i * 70); li.append(el('b', null, pad(i + 1)), el('span', null, flat(x.title))); ol.append(li); });
      R.append(ol);
      sc.append(L, R);
    } else if (b.scene === 'cover') {
      sc.append(el('div', 'ghost', pad(S.pos + 1)), roll(pad(S.pos + 1), 80),
        a(el('div', 'of', T.issue + '  ' + (S.pos + 1) + ' / ' + N), 250, 'translateX(-40px)'),
        kin(it.title, '', 380, sizeFor(it.title, [[10, 76], [16, 66], [24, 56], [999, 46]])));
      var sl = el('div', 'slash'); sl.style.setProperty('--d', '700ms'); sc.append(sl);
    } else if (b.scene === 'question') {
      var q = kin(it.question, '', 120, sizeFor(it.question, [[14, 66], [22, 58], [32, 50], [999, 42]]));
      var ul = el('div', 'uline'); ul.style.setProperty('--d', (300 + Array.from(it.question).length * 24) + 'ms');
      sc.append(el('div', 'ghost', '?'), a(el('div', 'kicker', T.question), 0, 'translateX(-40px)'), q, ul);
      if (it.context) sc.append(a(el('div', 'ctx', it.context), 700 + Array.from(it.question).length * 24));
    } else if (b.scene === 'claim') {
      var cl = it.claims[b.k], lbl = el('div', 'shotlbl'), cnt = el('div', 'cnt');
      cnt.append(document.createTextNode(String(b.k + 1)), el('i', null, ' / ' + it.claims.length));
      lbl.append(a(el('div', 'kicker', T.claims), 0, 'translateX(-40px)'), a(cnt, 100));
      sc.append(lbl, a(el('div', 'quote', '“'), 80), a(el('div', 'src', cl.source), 160),
        kin(cl.text, '', 300, sizeFor(cl.text, [[12, 64], [20, 56], [28, 48], [999, 40]])));
    } else if (b.scene === 'fact') {
      var list = b.kind === 'known' ? (it.facts || []) : (it.unknowns || []), txt = list[b.k];
      var lb = el('div', 'shotlbl'), ct = el('div', 'cnt');
      ct.append(document.createTextNode(String(b.k + 1)), el('i', null, ' / ' + list.length));
      lb.append(a(el('div', 'kicker', b.kind === 'known' ? T.known : T.unknown), 0, 'translateX(-40px)'), a(ct, 100));
      var row = el('div', 'frow');
      row.append(a(el('div', 'badge ' + b.kind, b.kind === 'known' ? '✓' : '?'), 80), kin(txt, '', 280, sizeFor(txt, [[10, 64], [16, 56], [24, 48], [999, 40]])));
      sc.append(lb, row);
    } else if (b.scene === 'choice') {
      sc.append(a(el('div', 'kicker', T.choose), 0, 'translateX(-40px)'), a(el('p', 'remind', it.question), 80));
      var rc = a(el('div', 'recap'), 160), chips = [];
      (it.facts || []).forEach(function (f) { chips.push(['known', '✓ ' + f]); });
      (it.unknowns || []).forEach(function (f) { chips.push(['unknown', '? ' + f]); });
      chips.slice(0, 4).forEach(function (x) { rc.append(el('span', x[0], x[1])); });
      if (chips.length > 4) rc.append(el('span', 'more', '+' + (chips.length - 4)));
      if (chips.length) sc.append(rc);
      var ops = el('div', 'opts');
      ops.style.gridTemplateColumns = 'repeat(' + Math.min(it.options.length, 4) + ', 1fr)';
      it.options.forEach(function (o, k) {
        var btn = a(el('button', 'opt'), 260 + k * 110);
        btn.dataset.key = o.key;
        btn.append(el('span', 'k', o.key), el('span', 'lb', o.label));
        if (o.note) btn.append(el('span', 'nt', o.note));
        btn.append(el('span', 'stamp', T.stamp));
        btn.onclick = function () { choose(o.key, btn); };
        ops.append(btn);
      });
      var alts = a(el('div', 'alts'), 300 + it.options.length * 110);
      [['other', T.other], ['later', T.later]].forEach(function (x, k) {
        var btn = el('button', 'alt ' + x[0]);
        btn.dataset.key = x[0];
        btn.append(el('span', 'k', String(it.options.length + k + 1)), document.createTextNode(x[1]));
        btn.onclick = function () { choose(x[0], btn); };
        alts.append(btn);
      });
      var panel = el('div', 'panel'), res = el('div', 'res'), inp = el('input'), go_ = el('button', 'go', S.pos + 1 < N ? T.next + ' →' : T.finish + ' →');
      inp.type = 'text';
      inp.oninput = function () { if (answers[S.pos]) { answers[S.pos].memo = inp.value; inp.classList.remove('bad'); save(); } };
      inp.onkeydown = function (e) { if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); commit(); } if (e.key === 'Escape') inp.blur(); };
      go_.onclick = commit;
      panel.append(res, inp, go_);
      sc.append(ops, alts, panel);
    } else if (b.scene === 'summary') {
      var head = el('div', 'head'), hl = el('div'), cnts = el('div', 'cnts');
      hl.append(a(el('div', 'kicker', T.summary), 0, 'translateX(-40px)'), kin(D.title || '', '', 120));
      var tally = { done: 0, later: 0, open: 0 };
      items.forEach(function (x, i) { var st = status(i).cls; tally[st === 'other' ? 'done' : st]++; });
      [['done', T.cDone], ['later', T.cLater], ['open', T.cOpen]].forEach(function (x, i) {
        var box = a(el('div', 'cntbox ' + x[0]), 250 + i * 100), n = el('b', null, '0');
        n.dataset.to = tally[x[0]];
        box.append(n, el('span', null, x[1])); cnts.append(box);
      });
      head.append(hl, cnts);
      var grid = el('div', 'sumgrid'), rows = el('div', 'rows' + (N > 7 ? ' dense' : ''));
      items.forEach(function (x, i) { rows.append(a(rowFor(i, function () { go(i, beatsOf(i).length - 1, false); }), 450 + i * 60)); });
      var box2 = a(el('div', 'copybox'), 500), pre = el('pre', null, summaryText()), acts = el('div', 'acts');
      var cb = el('button', 'copybtn', T.copy); cb.onclick = function () { copy(pre.textContent); };
      var rs = el('button', 'ghostbtn', T.restart); rs.onclick = function () { go(-1, 0, false); };
      var rz = el('button', 'ghostbtn', T.reset); rz.onclick = function () { if (confirm(T.resetQ)) { answers = {}; save(); S.key = ''; render(); updateBar(); } };
      acts.append(cb, rs, rz);
      box2.append(pre, acts);
      grid.append(rows, box2);
      sc.append(head, grid);
    }
    return sc;
  }
  function countUp(sc) {
    var ns = sc.querySelectorAll('[data-to]'), t0 = performance.now() + 350;
    (function tick(now) {
      var k = Math.max(0, Math.min(1, (now - t0) / 700)), e = 1 - Math.pow(1 - k, 3);
      for (var i = 0; i < ns.length; i++) ns[i].textContent = Math.round(+ns[i].dataset.to * e);
      if (k < 1) requestAnimationFrame(tick);
    })(performance.now());
  }

  function status(i) {
    var x = answers[i];
    if (!x) return { cls: 'open', text: T.open };
    if (x.choice === 'later') return { cls: 'later', text: T.later };
    if (x.choice === 'other') return { cls: 'other', text: T.other + (x.memo ? T.sep + x.memo : '') };
    var o = items[i].options.filter(function (y) { return y.key === x.choice; })[0];
    return { cls: 'done', text: x.choice + '. ' + (o ? o.label : '') };
  }
  function rowFor(i, onclick) {
    var st = status(i), row = el('button', 'row');
    row.append(el('span', 'n', i < 0 || i >= N ? '' : pad(i + 1)), el('span', 't', i < 0 ? T.cover : i >= N ? T.summary : flat(items[i].title)));
    if (i >= 0 && i < N) row.append(el('span', 'chip ' + st.cls, st.text));
    row.onclick = onclick;
    return row;
  }

  function choiceScene() { var sc = scenes.lastElementChild; return sc && sc.classList.contains('s-choice') && !sc.classList.contains('out') ? sc : null; }
  function paintChoice() {
    var sc = choiceScene(); if (!sc) return;
    var x = answers[S.pos];
    var bs = sc.querySelectorAll('.opt, .alt');
    for (var i = 0; i < bs.length; i++) bs[i].classList.toggle('sel', !!x && bs[i].dataset.key === x.choice);
    $('.opts', sc).classList.toggle('chosen', !!x);
    var panel = $('.panel', sc), inp = $('input', panel);
    panel.classList.toggle('show', !!x);
    if (!x) return;
    $('.res', panel).textContent = x.choice === 'other' ? T.other : status(S.pos).text;
    inp.placeholder = x.choice === 'other' ? T.otherMemo : x.choice === 'later' ? T.laterMemo : T.memo;
    if (document.activeElement !== inp) inp.value = x.memo || '';
  }
  function choose(key, btn) {
    var sc = choiceScene(); if (!sc) return;
    var prev = answers[S.pos] || {};
    answers[S.pos] = { choice: key, memo: prev.memo || '' };
    save();
    hush();
    sfx(key === 'later' ? 'later' : 'pick');
    paintChoice(); updateBar(); updateDrawer();
    btn = btn || sc.querySelector('[data-key="' + key + '"]');
    if (btn && key !== 'later') {
      var st = $('#stage').getBoundingClientRect(), r = btn.getBoundingClientRect(), k = st.width / 1280;
      var x = (r.left + r.width / 2 - st.left) / k, y = (r.top + r.height / 2 - st.top) / k;
      burst(x, y, key === 'other' ? ['#8b5cf6', '#ffd84d', '#111318'] : ['#2b59ff', '#ffd84d', '#10b06f', '#ff5a5f', '#111318']);
      pulse(x, y);
    }
    if (key === 'other') setTimeout(function () { var i = $('.panel input', sc); if (i) i.focus(); }, 50);
  }
  function commit() {
    var x = answers[S.pos];
    if (!x) { sfx('tick'); return toast(T.pick); }
    var sc = choiceScene(), inp = sc && $('.panel input', sc);
    if (x.choice === 'other' && !String(x.memo || '').trim()) { if (inp) { inp.classList.remove('bad'); inp.getBoundingClientRect(); inp.classList.add('bad'); inp.focus(); } return; }
    if (inp) inp.blur();
    go(S.pos + 1, 0, true);
  }

  function summaryText() {
    var out = ['【' + flat(D.title) + '】' + T.head + (D.date ? T.paren(D.date) : '')], dec = [], lat = [], opn = [];
    items.forEach(function (it, i) {
      var x = answers[i];
      if (!x) opn.push(i); else if (x.choice === 'later') lat.push(i); else dec.push(i);
    });
    if (dec.length) {
      out.push('', T.decided);
      dec.forEach(function (i, n) {
        var x = answers[i];
        out.push((n + 1) + '. ' + flat(items[i].title) + T.sep + status(i).text);
        if (x.choice !== 'other' && x.memo) out.push('   ' + T.note + x.memo);
      });
    }
    if (lat.length) {
      out.push('', T.laterH);
      lat.forEach(function (i) { var m = answers[i].memo; out.push('・' + flat(items[i].title) + (m ? T.paren(m) : '')); });
    }
    if (opn.length) {
      out.push('', T.openH);
      opn.forEach(function (i) { out.push('・' + flat(items[i].title)); });
    }
    return out.join('\n');
  }
  function copy(text) {
    function fallback() {
      var ta = el('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.append(ta); ta.select();
      try { document.execCommand('copy'); } catch (e) {}
      ta.remove(); done();
    }
    function done() { sfx('pop'); toast(T.copied); }
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(done, fallback);
    else fallback();
  }

  // ---- 上の帯・下のバー・目次 ----
  function hud() {
    $('#hud .deck').textContent = flat(D.title);
    var segs = $('#segs'); segs.innerHTML = '';
    var inChapter = S.pos >= 0 && S.pos < N;
    $('#hud .no').textContent = inChapter ? pad(S.pos + 1) + ' / ' + pad(N) : '';
    $('#foot .l').textContent = D.footer || '';
    $('#foot .r2').textContent = inChapter ? flat(items[S.pos].title) : '';
    if (!inChapter) return;
    beatsOf(S.pos).forEach(function (b, k) {
      var s = el('i', k < S.beat ? 'done' : ''); s.append(el('b')); segs.append(s);
    });
  }
  function fillSeg(full, ms) {
    var s = $('#segs').children[S.beat]; if (!s) return;
    var b = s.firstChild;
    b.style.transition = 'none'; b.style.transform = full ? 'scaleX(1)' : 'scaleX(0)';
    if (ms) { b.getBoundingClientRect(); b.style.transition = 'transform ' + ms + 'ms linear'; b.style.transform = 'scaleX(1)'; }
  }
  var ICON_PLAY = '<svg viewBox="0 0 24 24"><path d="M7 4v16l13-8z"/></svg>';
  var ICON_PAUSE = '<svg viewBox="0 0 24 24"><path d="M6 4h4v16H6zm8 0h4v16h-4z"/></svg>';
  function updateBar() {
    $('#bPlay').innerHTML = S.playing ? ICON_PAUSE : ICON_PLAY;
    $('#bNarr').classList.toggle('off', !S.narr);
    $('#bSe').classList.toggle('off', !S.se);
    $('#bNarr .lbl').textContent = T.narr + (S.narr ? ' ON' : ' OFF');
    $('#bSe .lbl').textContent = T.se + (S.se ? ' ON' : ' OFF');
    $('#bMenu .lbl').textContent = T.menu;
    var dots = $('#dots');
    if (dots.children.length !== N) {
      dots.innerHTML = '';
      items.forEach(function (it, i) {
        var d = el('button', null, String(i + 1)); d.title = flat(it.title);
        d.onclick = function () { audio(); go(i, 0, true); };
        dots.append(d);
      });
    }
    for (var i = 0; i < N; i++) dots.children[i].className = status(i).cls + (i === S.pos ? ' cur' : '');
  }
  function updateDrawer() {
    var dr = $('#drawer'); if (!dr.classList.contains('open')) return;
    dr.innerHTML = ''; dr.append(el('h3', null, T.menu));
    for (var i = -1; i <= N; i++) {
      (function (i) {
        var row = rowFor(i, function () { dr.classList.remove('open'); audio(); go(i, 0, i >= 0 && i < N); });
        if (i === S.pos) row.classList.add('cur');
        dr.append(row);
      })(i);
    }
  }
  function toggleMenu() { var dr = $('#drawer'); dr.classList.toggle('open'); updateDrawer(); }

  $('#bPlay').onclick = togglePlay;
  $('#bSkip').onclick = skip;
  $('#bPrev').onclick = prevChapter;
  $('#bMenu').onclick = toggleMenu;
  $('#bNarr').onclick = function () { S.narr = !S.narr; if (!S.narr) hush(); updateBar(); if (S.playing) go(S.pos, S.beat, true); };
  $('#bSe').onclick = function () { S.se = !S.se; updateBar(); };
  $('#voiceSel').onchange = function () {
    var name = this.value;
    voice = voices.filter(function (v) { return v.name === name; })[0] || voice;
    try { localStorage.setItem(VOICE_KEY, name); } catch (e) {}
    this.blur();
    if (!S.narr) { S.narr = true; updateBar(); }
    hush();
    if (S.playing) go(S.pos, S.beat, true);
    else speak(T.sayVoice, function () {});
  };
  $('#bFull').onclick = function () {
    if (document.fullscreenElement) document.exitFullscreen();
    else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
  };
  document.addEventListener('keydown', function (e) {
    if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.metaKey || e.ctrlKey || e.altKey) return;
    var b = cur(), k = e.key;
    if (k === ' ') { e.preventDefault(); togglePlay(); }
    else if (k === 'ArrowRight') skip();
    else if (k === 'ArrowLeft') prevChapter();
    else if (k === 'Enter' && b.wait) commit();
    else if (k === 'Enter' && b.scene === 'title') start();
    else if (k === 'm' || k === 'M') toggleMenu();
    else if (k === 'v' || k === 'V') $('#bNarr').click();
    else if (k === 's' || k === 'S') $('#bSe').click();
    else if (k === 'f' || k === 'F') $('#bFull').click();
    else if (k === 'Escape') $('#drawer').classList.remove('open');
    else if (b.wait && /^[1-9]$/.test(k)) {
      var it = items[S.pos], n = +k - 1, keys = it.options.map(function (o) { return o.key; }).concat(['other', 'later']);
      if (keys[n]) { e.preventDefault(); choose(keys[n]); }
    }
  });

  function fit() {
    var W = innerWidth, H = innerHeight - 64, s = Math.min(W / 1280, H / 720) * .96;
    $('#stage').style.transform = 'translate(-50%, -50%) scale(' + s + ')';
    // 拡大しても線がにじまないよう、キャンバスは表示の大きさに合わせて描く
    RES = Math.max(1, Math.min(2, s * (window.devicePixelRatio || 1)));
    [bg, fx].forEach(function (c) { c.width = Math.round(1280 * RES); c.height = Math.round(720 * RES); });
    drawBg(performance.now());
  }
  addEventListener('resize', fit);
  if ('speechSynthesis' in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
  fit();
  requestAnimationFrame(loop);
  document.title = flat(D.title) || 'decide-reel';
  go(-1, 0, false);
})();
</script>
</body>
