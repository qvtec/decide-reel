<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>decide-reel</title>
<style>
:root {
  --ink: #16181d;
  --sub: #5b6170;
  --mute: #9aa0ac;
  --line: #e4e6eb;
  --soft: #f5f6f8;
  --accent: #2b59ff;
  --accent-soft: #eaf0ff;
  --ok: #0f9d63;
  --ok-soft: #e6f6ee;
  --later: #b97a00;
  --later-soft: #fdf4e1;
  --other: #7a45f0;
  --other-soft: #f1ebfe;
  --outer: #e9ebef;
  --bar: #ffffff;
  --bar-ink: #16181d;
  --bar-line: #dfe2e7;
  --font: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic UI", "Meiryo", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root { --outer: #121418; --bar: #1c1f25; --bar-ink: #e8eaee; --bar-line: #2c3038; }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--outer); font-family: var(--font); color: var(--ink); }
button { font: inherit; color: inherit; cursor: pointer; }

/* ステージは1280x720で組んで、画面に合わせて拡大縮小する */
#viewport { position: fixed; inset: 0 0 64px 0; }
#stage {
  position: absolute; left: 50%; top: 50%; width: 1280px; height: 720px;
  background: #fff; overflow: hidden; border-radius: 6px;
  box-shadow: 0 12px 40px rgba(0, 0, 0, .14);
  transform-origin: center;
}

/* 上の帯：資料名・進み具合・番号 */
#hud { position: absolute; left: 0; right: 0; top: 0; height: 64px; display: flex; align-items: center; gap: 24px; padding: 0 40px; z-index: 5; }
#hud .deck { font-size: 15px; color: var(--sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 340px; }
#segs { flex: 1; display: flex; gap: 5px; }
#segs i { flex: 1; height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; position: relative; }
#segs i b { position: absolute; inset: 0; background: var(--accent); transform: scaleX(0); transform-origin: left; }
#segs i.done b { transform: scaleX(1); }
#hud .no { font-size: 15px; color: var(--sub); font-variant-numeric: tabular-nums; white-space: nowrap; }
#stage::after { content: ""; position: absolute; left: 40px; right: 40px; bottom: 36px; height: 1px; background: var(--line); }
#foot { position: absolute; left: 40px; right: 40px; bottom: 10px; font-size: 12px; color: var(--mute); display: flex; justify-content: space-between; }

/* 場面の切り替え */
.scene { position: absolute; inset: 84px 80px 60px; transition: opacity .45s ease, transform .55s cubic-bezier(.2, .8, .2, 1); }
.scene.pre { opacity: 0; transform: translateX(48px); }
.scene.out { opacity: 0; transform: translateX(-48px); pointer-events: none; }
.r { opacity: 0; transform: translateY(22px); transition: opacity .5s ease, transform .65s cubic-bezier(.2, .8, .2, 1); }
.r.in { opacity: 1; transform: none; }
.r.dim { opacity: .35; }
.kicker { font-size: 18px; font-weight: 700; color: var(--accent); letter-spacing: .08em; margin: 0 0 18px; }
.wipe { height: 6px; width: 120px; background: var(--accent); border-radius: 3px; transform: scaleX(0); transform-origin: left; transition: transform .9s cubic-bezier(.7, 0, .2, 1) .15s; }
.in .wipe, .wipe.in { transform: scaleX(1); }

/* 表紙 */
.s-title { display: grid; grid-template-columns: 1.25fr 1fr; gap: 64px; align-items: center; }
.s-title h1 { font-size: 54px; line-height: 1.25; margin: 22px 0 18px; letter-spacing: .01em; }
.s-title .subt { font-size: 22px; color: var(--sub); line-height: 1.6; margin: 0 0 28px; }
.s-title .meta { display: flex; gap: 22px; font-size: 17px; color: var(--sub); margin-bottom: 40px; }
.s-title .meta b { color: var(--ink); }
.startbtn { display: inline-flex; align-items: center; gap: 16px; border: 0; background: var(--accent); color: #fff; padding: 18px 34px 18px 26px; border-radius: 999px; font-size: 22px; font-weight: 700; box-shadow: 0 8px 24px rgba(43, 89, 255, .3); transition: transform .2s; }
.startbtn:hover { transform: translateY(-2px); }
.startbtn .tri { width: 0; height: 0; border-left: 18px solid #fff; border-top: 11px solid transparent; border-bottom: 11px solid transparent; }
.agenda { background: var(--soft); border-radius: 18px; padding: 28px 30px; max-height: 470px; overflow: auto; }
.agenda h3 { margin: 0 0 14px; font-size: 16px; color: var(--sub); letter-spacing: .08em; }
.agenda ol { margin: 0; padding: 0; list-style: none; counter-reset: a; }
.agenda li { counter-increment: a; display: flex; gap: 14px; padding: 11px 0; border-top: 1px solid var(--line); font-size: 19px; line-height: 1.45; }
.agenda li:first-child { border-top: 0; }
.agenda li::before { content: counter(a, decimal-leading-zero); color: var(--accent); font-weight: 800; font-variant-numeric: tabular-nums; }

/* 章の扉 */
.s-cover { display: flex; flex-direction: column; justify-content: center; }
.s-cover .num { font-size: 150px; font-weight: 800; line-height: 1; color: var(--accent); letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.s-cover .of { font-size: 20px; color: var(--sub); margin: 18px 0 10px; letter-spacing: .1em; }
.s-cover h2 { font-size: 56px; line-height: 1.3; margin: 0 0 28px; max-width: 1000px; }

/* 決めること */
.s-question { display: flex; flex-direction: column; justify-content: center; }
.s-question .q { font-size: 46px; line-height: 1.5; font-weight: 700; max-width: 1040px; margin: 0; }
.s-question .ctx { margin-top: 30px; font-size: 21px; color: var(--sub); line-height: 1.7; max-width: 980px; }
.s-question .mark { position: absolute; right: -10px; top: -40px; font-size: 300px; font-weight: 800; color: var(--accent-soft); line-height: 1; z-index: -1; }

/* 資料の言い分 */
.claims { display: grid; gap: 22px; margin-top: 8px; }
.claim { border: 1px solid var(--line); border-left: 6px solid var(--accent); border-radius: 14px; padding: 22px 26px; background: #fff; box-shadow: 0 4px 18px rgba(20, 30, 60, .06); }
.claim .src { display: inline-block; font-size: 15px; font-weight: 700; color: var(--accent); background: var(--accent-soft); border-radius: 999px; padding: 4px 14px; margin-bottom: 12px; }
.claim p { margin: 0; font-size: 23px; line-height: 1.6; }
.claims.dense .claim p { font-size: 19px; }
.claims.dense .claim { padding: 16px 20px; }

/* わかっていること */
.facts { display: grid; gap: 40px; }
.facts h3 { font-size: 18px; color: var(--sub); margin: 0 0 14px; letter-spacing: .06em; }
.facts ul { list-style: none; margin: 0; padding: 0; }
.facts li { display: flex; gap: 16px; align-items: flex-start; font-size: 23px; line-height: 1.55; padding: 14px 0; border-top: 1px solid var(--line); }
.facts li .ic { flex: none; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-size: 17px; font-weight: 800; margin-top: 3px; }
.facts .known .ic { background: var(--ok-soft); color: var(--ok); }
.facts .unknown .ic { background: var(--later-soft); color: var(--later); }
.facts.dense li { font-size: 19px; padding: 10px 0; }

/* 選ぶ */
.s-choice .remind { font-size: 25px; font-weight: 700; line-height: 1.45; margin: 0 0 22px; }
.opts { display: grid; gap: 18px; }
.opt { position: relative; text-align: left; background: #fff; border: 2px solid var(--line); border-radius: 18px; padding: 20px 22px; transition: border-color .2s, box-shadow .2s, opacity .3s, transform .2s; }
.opt:hover { border-color: #b9c6ff; transform: translateY(-2px); }
.opt .k { display: inline-grid; place-items: center; width: 44px; height: 44px; border-radius: 12px; background: var(--soft); font-size: 22px; font-weight: 800; color: var(--accent); margin-bottom: 12px; }
.opt .lb { display: block; font-size: 24px; font-weight: 700; line-height: 1.45; }
.opt .nt { display: block; font-size: 17px; color: var(--sub); line-height: 1.55; margin-top: 8px; }
.opt.sel { border-color: var(--accent); box-shadow: 0 0 0 5px var(--accent-soft); }
.opt.sel .k { background: var(--accent); color: #fff; }
.opts.chosen .opt:not(.sel) { opacity: .4; }
.alts { display: flex; gap: 14px; margin-top: 18px; }
.alt { border: 2px dashed var(--line); background: #fff; border-radius: 999px; padding: 12px 24px; font-size: 19px; font-weight: 700; color: var(--sub); transition: border-color .2s, background .2s; }
.alt:hover { border-color: var(--mute); }
.alt .k { display: inline-block; min-width: 22px; color: var(--mute); margin-right: 6px; font-variant-numeric: tabular-nums; }
.alt.sel.other { border: 2px solid var(--other); background: var(--other-soft); color: var(--other); }
.alt.sel.later { border: 2px solid var(--later); background: var(--later-soft); color: var(--later); }
.opts.chosen ~ .alts .alt:not(.sel) { opacity: .45; }
.panel { display: flex; align-items: center; gap: 16px; margin-top: 20px; padding: 16px 18px; background: var(--soft); border-radius: 16px; visibility: hidden; opacity: 0; transform: translateY(12px); transition: opacity .35s, transform .45s cubic-bezier(.2, .8, .2, 1); }
.panel.show { visibility: visible; opacity: 1; transform: none; }
.panel .res { flex: none; font-size: 19px; font-weight: 800; max-width: 380px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.panel input { flex: 1; min-width: 0; font: inherit; font-size: 19px; padding: 12px 16px; border: 2px solid var(--line); border-radius: 12px; background: #fff; color: var(--ink); outline: none; }
.panel input:focus { border-color: var(--accent); }
.panel input.bad { border-color: #e5484d; animation: shake .35s; }
.panel .go { flex: none; border: 0; background: var(--accent); color: #fff; border-radius: 12px; padding: 13px 22px; font-size: 19px; font-weight: 700; }
@keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
.stamp { position: absolute; right: 16px; top: 14px; font-size: 14px; font-weight: 800; color: var(--accent); border: 2px solid var(--accent); border-radius: 8px; padding: 2px 8px; transform: rotate(8deg) scale(1.6); opacity: 0; transition: transform .3s cubic-bezier(.3, 1.6, .5, 1), opacity .2s; }
.opt.sel .stamp { transform: rotate(8deg) scale(1); opacity: 1; }

/* まとめ */
.s-summary { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; }
.s-summary h2 { font-size: 40px; margin: 0 0 18px; }
.rows { max-height: 440px; overflow: auto; }
.row { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; background: none; border: 0; border-top: 1px solid var(--line); padding: 13px 4px; font-size: 18px; }
.row:hover { background: var(--soft); }
.row .n { color: var(--accent); font-weight: 800; font-variant-numeric: tabular-nums; }
.row .t { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chip { flex: none; font-size: 14px; font-weight: 700; border-radius: 999px; padding: 4px 12px; max-width: 260px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chip.done { background: var(--ok-soft); color: var(--ok); }
.chip.other { background: var(--other-soft); color: var(--other); }
.chip.later { background: var(--later-soft); color: var(--later); }
.chip.open { background: var(--soft); color: var(--mute); }
.copybox { display: flex; flex-direction: column; gap: 14px; }
.copybox pre { flex: 1; margin: 0; background: var(--soft); border-radius: 14px; padding: 20px 22px; font-family: var(--font); font-size: 16px; line-height: 1.7; white-space: pre-wrap; overflow: auto; max-height: 420px; }
.copybox .acts { display: flex; gap: 12px; }
.copybtn { border: 0; background: var(--accent); color: #fff; border-radius: 12px; padding: 14px 24px; font-size: 19px; font-weight: 700; }
.ghost { border: 2px solid var(--line); background: #fff; border-radius: 12px; padding: 12px 20px; font-size: 16px; color: var(--sub); }

/* 目次 */
#drawer { position: absolute; top: 0; right: 0; bottom: 0; width: 420px; background: #fff; box-shadow: -12px 0 40px rgba(0, 0, 0, .12); z-index: 20; padding: 28px 24px; overflow: auto; transform: translateX(105%); transition: transform .35s cubic-bezier(.2, .8, .2, 1); }
#drawer.open { transform: none; }
#drawer h3 { margin: 0 0 12px; font-size: 16px; color: var(--sub); letter-spacing: .08em; }
#drawer .row.cur { background: var(--accent-soft); }

#toast { position: absolute; left: 50%; bottom: 64px; transform: translate(-50%, 20px); background: var(--ink); color: #fff; padding: 12px 22px; border-radius: 999px; font-size: 17px; opacity: 0; transition: opacity .25s, transform .3s; z-index: 30; pointer-events: none; }
#toast.show { opacity: 1; transform: translate(-50%, 0); }

/* 下の操作バー（ステージの外） */
#bar { position: fixed; left: 0; right: 0; bottom: 0; height: 64px; background: var(--bar); color: var(--bar-ink); border-top: 1px solid var(--bar-line); display: flex; align-items: center; gap: 8px; padding: 0 16px; }
#bar .grp { display: flex; align-items: center; gap: 4px; }
#bar .sp { flex: 1; min-width: 8px; }
.bb { border: 0; background: none; border-radius: 10px; height: 40px; min-width: 40px; padding: 0 10px; display: inline-flex; align-items: center; gap: 6px; font-size: 14px; }
.bb:hover { background: rgba(127, 127, 127, .14); }
.bb svg { width: 20px; height: 20px; fill: currentColor; }
.bb.off { opacity: .45; }
.bb.play { background: var(--accent); color: #fff; min-width: 48px; }
#voiceSel { height: 34px; max-width: 190px; border: 1px solid var(--bar-line); border-radius: 8px; background: var(--bar); color: var(--bar-ink); font: inherit; font-size: 13px; padding: 0 6px; }
#voiceSel:disabled { opacity: .45; }
#dots { display: flex; gap: 6px; padding: 4px; overflow-x: auto; scrollbar-width: none; }
#dots button { flex: none; width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--bar-line); background: none; font-size: 12px; font-weight: 700; color: var(--bar-ink); font-variant-numeric: tabular-nums; }
#dots button.done { background: var(--ok); border-color: var(--ok); color: #fff; }
#dots button.other { background: var(--other); border-color: var(--other); color: #fff; }
#dots button.later { background: var(--later); border-color: var(--later); color: #fff; }
#dots button.cur { box-shadow: 0 0 0 3px var(--accent); }
@media (max-width: 720px) { .bb .lbl { display: none; } #voiceSel { max-width: 110px; } }
@media (max-width: 520px) { #dots { display: none; } }
</style>
</head>

  </div>
</div>

    else if (k === 'm' || k === 'M') toggleMenu();
    else if (k === 'v' || k === 'V') $('#bNarr').click();
    else if (k === 's' || k === 'S') $('#bSe').click();
    else if (k === 'f' || k === 'F') $('#bFull').click();
    else if (k === 'Escape') $('#drawer').classList.remove('open');
    else if (b.wait && /^[1-9]$/.test(k)) {
      var it = items[S.pos], n = +k - 1, keys = it.options.map(function (o) { return o.key; }).concat(['other', 'later']);
      if (keys[n]) { e.preventDefault(); choose(keys[n]); }
    }
  });

  function fit() {
    var W = innerWidth, H = innerHeight - 64, s = Math.min(W / 1280, H / 720) * .96;
    $('#stage').style.transform = 'translate(-50%, -50%) scale(' + s + ')';
  }
  addEventListener('resize', fit);
  fit();
  document.title = D.title || 'decide-reel';
  go(-1, 0, false);
})();
</script>
</body>
</html>
